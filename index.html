
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First AWS Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            text-align: center;
            padding: 80px 20px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccd6e5;
        }

        h1 {
            color: #174ea6;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Hello, AWS! 🚀</h1>

        <p>Welcome to my first website.</p>

        <p>I am learning AWS and DevOps.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Congratulations! Your website is working!";
        }
    </script>
</body>
</html>
